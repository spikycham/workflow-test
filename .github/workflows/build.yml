name: Docker Image CI

on:
  push:
    branches: ["main"]
    paths:
      - "web/VERSION"
      - "server/Dockerfile"
  pull_request:
    branches: [ "main" ]
    types: [closed]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v6

    - name: use pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12

    - name: install deps
      working-directory: ./web
      run: pnpm install

    - name: build project
      working-directory: ./web
      run: pnpm build

    - name: build image
      env:
        SHA: ${{ github.sha }}
      run: docker build ./web -t 450139220/ci-test-web:${SHA:0:4}
    - name: push image
      run: |
        docker login -u 450139220 -p ${{ secrets.DOCKER_HUB_TOKEN }}
        docker push 450139220/ci-test-web:${SHA:0:4}
