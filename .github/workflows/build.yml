name: Docker Image CI

on:
  pull_request:
    branches: [ "main" ]
    types: [closed]

jobs:

  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v6

    - name: install pnpm and node
      uses: pnpm/setup@v1
      with:
        version: 12
        runtime: node@26
        cache: true

    - name: install deps
      run: pnpm install

    - name: build project
      run: pnpm build

    - name: build image
      run: docker build ./web -t spikycham/ci-test-web:${{ github.sha }}
    - name: push image
      run: |
        docker login -u spikycham -p ${{ secrets.DOCKER_HUB_TOKEN }}
        docker push spikycham/ci-test-web:${{ github.sha }}
