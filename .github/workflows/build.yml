name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [ "main" ]
    types: [closed]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v6

    - name: use pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12
        cache: true

    - name: install deps
      run: pnpm install

    - name: build project
      run: pnpm build

    - name: build image
      run: docker build ./web -t spikycham/ci-test-web:${{ github.sha }}
    - name: push image
      run: |
        docker login -u spikycham -p ${{ secrets.DOCKER_HUB_TOKEN }}
        docker push spikycham/ci-test-web:${{ github.sha }}
